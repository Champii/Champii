<svg xmlns="http://www.w3.org/2000/svg" width="960" height="220" viewBox="0 0 960 220" fill="none" role="img" aria-labelledby="title description">
  <title id="title">Mutant — mutable data, distributed storage</title>
  <desc id="description">An abstract illustration of a file divided into chunks and connected to peers in a decentralized storage network. The drawing is conceptual, not a live network map.</desc>
